[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ouch"
dynamic = ["version"]  # single source: ouch/__init__.py (docs/versioning-and-releases.md)
description = "A CPA-grade personal tax estimation CLI"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2.7",
    "PyYAML>=6",
    "platformdirs>=4",
    "tomli-w>=1",
]

[project.optional-dependencies]
pdf = ["pdfplumber", "pypdf"]
ocr = ["ocrmypdf"]
ai = ["anthropic", "keyring"]
crypto = ["cryptography", "keyring"]
harvest = ["pandas"]
all = ["ouch[pdf,ocr,ai,crypto,harvest]"]
dev = ["pytest>=8", "hypothesis>=6", "reportlab>=4", "build>=1.2", "pre-commit>=4",
       "ouch[pdf]"]

[project.scripts]
ouch = "ouch.cli.app:main"

[tool.setuptools.dynamic]
version = { attr = "ouch.__version__" }

[tool.setuptools.packages.find]
include = ["ouch*"]

[tool.setuptools.package-data]
"ouch.taxdata" = ["data/**/*.yaml"]
"ouch.pdf" = ["maps/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
