[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ouch"
version = "0.1.0"
description = "A CPA-grade personal tax estimation CLI"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2.7",
    "PyYAML>=6",
    "platformdirs>=4",
]

[project.optional-dependencies]
pdf = ["pdfplumber", "pypdf"]
ocr = ["ocrmypdf"]
ai = ["anthropic", "keyring"]
crypto = ["cryptography", "keyring"]
harvest = ["pandas"]
all = ["ouch[pdf,ocr,ai,crypto,harvest]"]
dev = ["pytest>=8", "hypothesis>=6"]

[project.scripts]
ouch = "ouch.cli.app:main"

[tool.setuptools.packages.find]
include = ["ouch*"]

[tool.setuptools.package-data]
"ouch.taxdata" = ["data/**/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
