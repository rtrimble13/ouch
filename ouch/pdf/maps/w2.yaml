# W-2 mapping table (spec §11.5). Mappings live in data, not code.
form: W-2
id: w2
owner_scoped: true            # values belong to taxpayer or spouse
signatures:
  - "Wage and Tax Statement"
  - "OMB No. 1545-0008"
fields:
  - box: "1"
    labels: ["Wages, tips, other compensation"]
    target: income.wages.{owner}_w2
    type: money
    aggregate: sum
    validate: {min: 0, max: 100_000_000}
  - box: "2"
    labels: ["Federal income tax withheld"]
    target: payments.withholding.federal_ytd
    type: money
    aggregate: sum
  - box: "3"
    labels: ["Social security wages"]
    target: income.wages.{owner}_ss_wages
    type: money
    aggregate: sum
  - box: "5"
    labels: ["Medicare wages and tips"]
    target: income.wages.{owner}_medicare_wages
    type: money
    aggregate: sum
    required: false
  - box: "17"
    labels: ["State income tax"]
    target: payments.withholding.state_ytd
    type: money
    aggregate: sum
    required: false
  - box: "19"
    labels: ["Local income tax"]
    target: payments.withholding.local_ytd
    type: money
    aggregate: sum
    required: false
# Box 12 holds up to four code/amount pairs (12a–12d): "the IRS code to the
# left of the vertical line … and the money amount to the right" (General
# Instructions for Forms W-2 and W-3 (2026)). New for 2026:
#   TP — "Total amount of cash tips reported to the employer". That is ALL
#        cash tips: box 14b lists the Treasury Tipped Occupation Code(s), and
#        "000" there means some tips came from a nonqualifying occupation.
#   TT — "Total amount of qualified overtime compensation": "only the 'half'
#        portion of 'time-and-a-half'".
coded_fields:
  - box: "12"
    slots: [a, b, c, d]
    code: TP
    description: "Cash tips reported to employer (qualified tips if the occupation qualifies)"
    target: income.wages.{owner}_qualified_tips
    occupation_check:
      box: "14b"
      label: "Treasury Tipped Occupation Code"
      nonqualifying_code: "000"
  - box: "12"
    slots: [a, b, c, d]
    code: TT
    description: "Qualified overtime compensation"
    target: income.wages.{owner}_qualified_overtime
