# Federal tax data — 2025: Rev. Proc. 2024-40 as modified for P.L. 119-21
# ("OBBBA") by Rev. Proc. 2025-32 §3, plus the 2025 forms and instructions.
# Each section cites its source in a comment; the full list is in meta.source.
#
# Every figure traces to published guidance and every 2025 provision ouch
# covers is modelled. Still `verified: false` until a reviewer checks a
# random sample of figures against the sources (spec appendix D, item 6).
meta:
  jurisdiction: US
  year: 2025
  schema_version: 3
  verified: false
  source:
    - "Rev. Proc. 2024-40 §2.01 (rate tables), .02 (kiddie tax), .03 (0%/15% maximums), .05 (refundable CTC), .06 (EITC), .11 (AMT), .15(2)-(3) (dependent and aged/blind standard deduction), .27 (QBI)"
    - "Rev. Proc. 2025-32 §3.01: OBBBA §70102 standard deduction for 2025; §3 modifies no other 2025 item used here"
    - "Rev. Proc. 2025-32 §2.03 and Schedule 8812 instructions (2025): CTC $2,200; phase-out $400,000 joint / $200,000 all other"
    - "Instructions for Schedule A (Form 1040) (2025): SALT cap $40,000 ($20,000 MFS), 30% phase-down above $500,000 ($250,000) MAGI, floor $10,000 ($5,000)"
    - "2025 Form 1040-ES: $176,100 social security maximum; due dates (June 16, 2025)"
    - "Notice 2025-67: 2025 saver's credit limits (the amounts it increases from)"
    - "IRS quarterly interest rates page: 2025 underpayment rates (IRB 2024-49, 2025-13, 2025-23, 2025-37)"
    - "Schedule 1-A (Form 1040) (2025), Parts II–V: tips, overtime, car-loan interest, senior deduction; IRS OBBBA provisions page: 2025 through 2028"
    - "Instructions for Forms 8959 (QSS $200,000), 8960, 8863, Schedule D; Pubs 502, 526, 915, 936 (statutory, unindexed amounts)"
  notes: >
    Checked against Rev. Proc. 2024-40, Rev. Proc. 2025-32 and the 2025 forms
    and instructions. Awaiting an independent reviewer's sample check (spec
    appendix D, item 6) before verified is set to true.

