    phaseout_threshold:        # line 32: MAGI
      single: 75_000
      married_filing_jointly: 150_000
      married_filing_separately: 75_000   # not claimable: joint return required
      head_of_household: 75_000
      qualifying_surviving_spouse: 75_000
    phaseout_rate: 0.06        # line 34
  # Schedule 1-A (Form 1040) (2025) Parts II–IV. Statutory for 2025–2028, not indexed.
  tips:                        # Part II, lines 7–13
    cap:                       # line 7: per return
      single: 25_000
      married_filing_jointly: 25_000
      married_filing_separately: 25_000
      head_of_household: 25_000
      qualifying_surviving_spouse: 25_000
    phaseout_threshold:        # line 9
      single: 150_000
      married_filing_jointly: 300_000
      married_filing_separately: 150_000   # not claimable: joint return required
      head_of_household: 150_000
      qualifying_surviving_spouse: 150_000
    reduction_per_step: 100    # lines 11–12: $100 per $1,000, rounded down
    round_steps: down
    joint_return_required: true
  overtime:                    # Part III, lines 15–21
    cap:                       # line 15
      single: 12_500
      married_filing_jointly: 25_000
      married_filing_separately: 12_500
      head_of_household: 12_500
      qualifying_surviving_spouse: 12_500
    phaseout_threshold:        # line 17
      single: 150_000
      married_filing_jointly: 300_000
      married_filing_separately: 150_000   # not claimable: joint return required
      head_of_household: 150_000
      qualifying_surviving_spouse: 150_000
    reduction_per_step: 100    # lines 19–20: $100 per $1,000, rounded down
    round_steps: down
    joint_return_required: true
  car_loan_interest:           # Part IV, lines 24–30
