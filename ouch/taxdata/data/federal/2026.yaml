credits:
  child_tax_credit:            # 2026 Schedule 8812: $2,200, $500 ODC, 400k/200k, 5%, $1,700, $2,500, 15%, under 17
    amount_per_child: 2_200     # Rev. Proc. 2025-32 §4.05(1)
    refundable_cap: 1_700       # §4.05(2)
    phaseout_start:
      single: 200_000
      married_filing_jointly: 400_000
      married_filing_separately: 200_000
      head_of_household: 200_000
      qualifying_surviving_spouse: 200_000   # "All other filing statuses"
    phaseout_rate_per_1000: 50
    qualifying_age_max: 16
    refundable_earned_income_floor: 2_500
    refundable_earned_income_pct: 0.15
  other_dependent_credit:
    amount: 500
  eitc:                         # Rev. Proc. 2025-32 §4.06
    investment_income_limit: 12_200
    # The rates are statutory (§32(b)(1)); each matches the table:
    # max credit = rate × earned income amount, and
    # completed phaseout = threshold + max credit / phaseout rate.
    by_children:
      - {children: 0, phase_in_rate: 0.0765, earned_income_amount: 8_680,
         max_credit: 664, phaseout_start_mfj: 18_140,
         phaseout_start_other: 10_860, phaseout_rate: 0.0765}
      - {children: 1, phase_in_rate: 0.34, earned_income_amount: 13_020,
         max_credit: 4_427, phaseout_start_mfj: 31_160,
         phaseout_start_other: 23_890, phaseout_rate: 0.1598}
      - {children: 2, phase_in_rate: 0.40, earned_income_amount: 18_290,
         max_credit: 7_316, phaseout_start_mfj: 31_160,
         phaseout_start_other: 23_890, phaseout_rate: 0.2106}
      - {children: 3, phase_in_rate: 0.45, earned_income_amount: 18_290,
         max_credit: 8_231, phaseout_start_mfj: 31_160,
         phaseout_start_other: 23_890, phaseout_rate: 0.2106}
  # PRE-2026 SCHEDULE, NOT 2026 LAW. The 2026 credit's maximum rate is 50%
  # (2026 Form 1040-ES, Pub 505), with a step-down schedule this schema
  # can't express yet (rtrimble13/ouch#25). Until then the credit is
  # understated for lower-AGI filers.
  child_dependent_care:
    max_expenses_one: 3_000
    max_expenses_two_plus: 6_000
    max_rate: 0.35
    min_rate: 0.20
    agi_threshold: 15_000
    step: 2_000
    step_rate: 0.01
    qualifying_age_max: 12
  education:
    aotc:                       # Form 8863 instructions (statutory, not indexed)
      first_dollar: 2_000
      second_rate: 0.25
      second_cap: 2_000
      refundable_pct: 0.40
      phaseout: {mfj_start: 160_000, mfj_end: 180_000,
                 other_start: 80_000, other_end: 90_000}
    llc:
      rate: 0.20
      max_expenses: 10_000
      phaseout: {mfj_start: 160_000, mfj_end: 180_000,
                 other_start: 80_000, other_end: 90_000}
  savers_credit:                # Notice 2025-67; 2026 Form 8880 line 6 and line 9 table
