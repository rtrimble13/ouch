# Federal tax data — 2026, rebuilt from Rev. Proc. 2025-32 and current law
# (P.L. 119-21, "OBBBA"). Each section cites its source in a comment; the
# full list is in meta.source.
#
# Still `verified: false`: some 2026 law isn't representable yet, so those
# parameters stay at their pre-2026 values (see meta.notes):
#   - child and dependent care credit: 2026 rate schedule (rtrimble13/ouch#25)
#   - charitable 0.5% floor, non-itemizer deduction, §68 limit (rtrimble13/ouch#24)
#   - QBI minimum deduction (rtrimble13/ouch#25)
#   - Schedule 1-A tips, overtime, car-loan interest (rtrimble13/ouch#26)
meta:
  jurisdiction: US
  year: 2026
  schema_version: 3
  verified: false
  source:
    - "Rev. Proc. 2025-32 §4.01 (rate tables), .02 (dependent standard deduction), .03 (0%/15% maximums), .05 (CTC), .06 (EITC), .10 (AMT), .14 (standard deduction), .26 (QBI)"
    - "Rev. Proc. 2025-32 §2.07: OBBBA §70107, AMT $1,000,000 phase-out threshold not indexed before 2027"
    - "2026 Form 1040-ES, What's New: additional age-65/blind amounts, $184,500 social security maximum, $1,700 ACTC, QBI phase-in ranges"
    - "Pub 505 (2026): SALT cap $40,400 ($20,200 MFS), MAGI threshold $505,000, floor $10,000 ($5,000 MFS); estimated-tax due dates; safe harbors"
    - "Instructions for Schedule A (Form 1040) (2025), State and Local Tax Deduction Worksheet line 7: 30% phase-down rate"
    - "IRS quarterly interest rates page: 2026 individual underpayment rates (IRB 2025-48, 2026-8, 2026-22, 2026-36)"
    - "Schedule 1-A (Form 1040) (2025), Part V; IRS OBBBA provisions page: senior deduction 2025 through 2028"
    - "2026 Schedule 8812 (CTC, ODC, phase-out, refundable portion); Notice 2025-67 and 2026 Form 8880 (saver's credit)"
    - "Instructions for Forms 8959 and 8960, Form 8863, Schedule D; Pubs 502, 526, 915, 936 (statutory, unindexed amounts)"
  notes: >
    Rebuilt from 2026 primary sources. Parameters for provisions the engine
    can't model yet stay at their pre-2026 values: the dependent care credit
    (2026 50% maximum rate, rtrimble13/ouch#25), the charitable 0.5% floor,
    non-itemizer deduction and §68 limitation (rtrimble13/ouch#24), the QBI
    minimum deduction (rtrimble13/ouch#25), and the Schedule 1-A tips,
    overtime and car-loan deductions (rtrimble13/ouch#26). The file stays
    unverified until those land.

