amt:                          # Rev. Proc. 2025-32 §4.10
  exemption:
    single: 90_100            # "Unmarried Individuals (other than Surviving Spouses)"
    married_filing_jointly: 140_200
    married_filing_separately: 70_100
    head_of_household: 90_100
    qualifying_surviving_spouse: 140_200
  phaseout_threshold:         # OBBBA §70107: back to $500,000 / $1,000,000, not indexed before 2027
    single: 500_000
    married_filing_jointly: 1_000_000
    married_filing_separately: 500_000
    head_of_household: 500_000
    qualifying_surviving_spouse: 1_000_000
  # 50%: each "Complete Phaseout Amount" in §4.10 is the threshold plus twice
  # the exemption (e.g. 1,000,000 + 2 × 140,200 = 1,280,400).
  phaseout_rate: 0.50
  brackets:
    - {up_to: 244_500, rate: 0.26}
    - {up_to: null,    rate: 0.28}
  brackets_mfs:
    - {up_to: 122_250, rate: 0.26}
    - {up_to: null,    rate: 0.28}

