# Federal tax data — 2026, rebuilt from Rev. Proc. 2025-32 and current law
# (P.L. 119-21, "OBBBA"). Each section cites its source in a comment; the
# full list is in meta.source.
#
# Still `verified: false`: several 2026 figures come from IRS draft forms
# and instructions (see meta.notes) and need re-checking against the final
# versions.
meta:
  jurisdiction: US
  year: 2026
  schema_version: 3
  verified: false
  source:
    - "Rev. Proc. 2025-32 §4.01 (rate tables), .02 (dependent standard deduction), .03 (0%/15% maximums), .05 (CTC), .06 (EITC), .10 (AMT), .14 (standard deduction), .26 (QBI)"
    - "Rev. Proc. 2025-32 §2.07: OBBBA §70107, AMT $1,000,000 phase-out threshold not indexed before 2027"
    - "2026 Form 1040-ES, What's New: additional age-65/blind amounts, $184,500 social security maximum, $1,700 ACTC, QBI phase-in ranges"
    - "Pub 505 (2026): SALT cap $40,400 ($20,200 MFS), MAGI threshold $505,000, floor $10,000 ($5,000 MFS); estimated-tax due dates; safe harbors"
    - "Instructions for Schedule A (Form 1040) (2025), State and Local Tax Deduction Worksheet line 7: 30% phase-down rate"
    - "IRS quarterly interest rates page: 2026 individual underpayment rates (IRB 2025-48, 2026-8, 2026-22, 2026-36)"
    - "Schedule 1-A (Form 1040) (2025), Parts II–V; 2026 Form 1040-ES What's New (tips, overtime, car-loan interest, seniors); IRS OBBBA provisions page: 2025 through 2028"
    - "2026 Schedule 8812 (CTC, ODC, phase-out, refundable portion); Notice 2025-67 and 2026 Form 8880 (saver's credit)"
    - "Instructions for Forms 8959 and 8960, Form 8863, Schedule D; Pubs 502, 526, 915, 936 (statutory, unindexed amounts)"
    - "IRS OBBB provisions page (irs.gov/obbb), Section 70405: 50% maximum care credit rate, $3,000/$6,000 expense limits; draft 2026 Instructions for Form 2441, line 8 2026 Phaseout Schedule"
    - "Rev. Proc. 2025-32 §2.12; draft 2026 Form 8995 lines 15–17 and its draft instructions (line 16): $400 minimum QBI deduction for at least $1,000 of active QBI"
    - "Draft 2026 Form 1040 lines 12e–13b and Instructions (What's New; line 12f); draft 2026 Schedule A line 18; 2026 Form 1040-ES What's New: charitable 0.5% floor, non-itemizer deduction, §68 limitation"
  notes: >
    Rebuilt from 2026 primary sources. From IRS DRAFT 2026 forms and
    instructions, to re-check against the final versions: the dependent care
    credit schedule (Form 2441), the QBI minimum (Form 8995), the
    non-itemizer charitable deduction (Form 1040 line 12f), and the §68
    limitation's measure (Schedule A line 18). The §68 rate is the 1040-ES's
    rounded 5.4%, and its Itemized Deductions Worksheet isn't published yet.

