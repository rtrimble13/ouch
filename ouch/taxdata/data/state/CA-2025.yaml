# California — 2025, from the FTB 2025 Personal Income Tax Booklet (Form 540).
# The 1% Behavioral Health Services Tax on taxable income over $1,000,000
# (Form 540 line 62) is folded into the brackets as a split at $1,000,000.
# Approximations: the Tax Table below $100,000 is computed from the rate
# schedules; itemized deductions start from the federal Schedule A less state
# income tax, so California's own itemized rules (no SALT cap, its own
# limitation) aren't applied.
