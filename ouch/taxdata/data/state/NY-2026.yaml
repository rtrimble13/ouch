# New York State — 2026, from NY DTF Instructions for Form IT-2105 (2026), Estimated Income Tax Payment Voucher for Individuals.
# Not modeled (fidelity: approximate): the tax computation for New York AGI
# over $107,650 (IT-201-I Tax computation worksheets 1–12), which recaptures
# the benefit of the lower brackets and so raises tax for most filers above
# that AGI; New York's own itemized deduction rules (Form IT-196).
meta:
  jurisdiction: NY
  year: 2026
  schema_version: 3
  verified: true
  source:
    - "NY DTF Instructions for Form IT-2105 (2026), Estimated Income Tax Payment Voucher for Individuals: 2026 New York State tax rates (p. 10)"
    - "NY DTF Instructions for Form IT-2105 (2026), Estimated Income Tax Payment Voucher for Individuals: line 2 New York State standard deduction table; dependent exemption $1,000 each (worksheet line 4)"
    - "IT-201-I (2025): line 20 non-New York municipal interest addition; lines 27–29 Social Security, U.S. obligation interest, pension and annuity exclusion up to $20,000 from age 59½"
    - "IT-2105-I (2026): the five lower rates fall to 3.90%, 4.40%, 5.15%, 5.40% and 5.90%; the thresholds are unchanged"
  notes: "AGI over $107,650: the recapture worksheets aren't modeled, so tax is understated there. Itemized deductions follow the federal Schedule A less state income tax."

